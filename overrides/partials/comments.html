<!-- Giscus Comments Integration -->
<!-- Docs: https://giscus.app -->
{% if page and page.file and page.file.src_path != "index.md" and not (page.meta and page.meta.get("hide_comments")) %}
<div class="pm-comments-section">
  <h2 id="discussion">💬 Discussion</h2>
  <p class="pm-comments-intro">Have a question about this topic? Found an error? Share your thoughts below.</p>

  <script
    src="https://giscus.app/client.js"
    data-repo="SSnp75/PythonMastery-Site"
    data-repo-id="R_kgDOUCOHpA"
    data-category="Announcements"
    data-category-id="DIC_kwDOUCOHpM4DGM0s"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</div>

<script>
  // Sync Giscus theme with Material's light/dark toggle
  (function () {
    function giscusTheme() {
      var scheme = document.body.getAttribute("data-md-color-scheme");
      return scheme === "slate" ? "dark" : "light";
    }
    function sendTheme() {
      var frame = document.querySelector("iframe.giscus-frame");
      if (!frame) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusTheme() } } },
        "https://giscus.app"
      );
    }
    // When the user flips the palette toggle, update Giscus
    var toggles = document.querySelectorAll("[data-md-color-scheme] , form[data-md-component=palette] input");
    document.querySelectorAll("form[data-md-component=palette] input").forEach(function (input) {
      input.addEventListener("change", function () { setTimeout(sendTheme, 100); });
    });
  })();
</script>
{% endif %}
