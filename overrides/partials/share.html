<!-- Share this page: QR code + email + copy link -->
{% if page and page.file and page.file.src_path != "index.md" and not (page.meta and page.meta.get("hide_share")) %}
<div class="pm-share-section" data-pm-share>
  <h2 id="share">🔗 Share this page</h2>
  <p class="pm-share-intro">Scan the QR code to open this page on your phone, or share the link.</p>
  <div class="pm-share-grid">
    <div class="pm-share-qr" data-pm-qr aria-label="QR code for this page"></div>
    <div class="pm-share-actions">
      <a class="pm-share-btn" data-pm-email href="#">✉️ Email this page</a>
      <button class="pm-share-btn" type="button" data-pm-copy>🔗 Copy link</button>
      <span class="pm-share-url" data-pm-url></span>
    </div>
  </div>
</div>

<!-- Tiny, dependency-free QR generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
{% endif %}
